<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">    
    <link rel="icon" href="./images/roller-icon.svg">
    <link rel="stylesheet" href="./styles.css">
    <script src="scripts.js" defer></script>
</head>

<body>
    <!-- HEADER -->
    <header>
        <img src="./images/roller-icon.svg" height="100px">
        <h1>Etch-a-Sketch</h1>
    </header>

    <!-- CONTENT -->
    <main>
        <div class="options">
            <div id="size-label">16 x 16</div>
            <input id="size" type="range" min="16" max="128" step="16" value="16"></input>
            <input id="colour-picker" type="color" value="#000000"></input>
            <button id="colour">Colour mode</button>
            <button id="rainbow">Rainbow</button>
            <button id="rubber">Rubber</button>
            <button id="clear">Clear all</button>
        </div>
        <div class="grid">
        </div>
        <div id="spacer"></div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p><em>Created by Dan</em></p>
    </footer>

</body>
</html>
